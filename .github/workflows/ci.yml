name: Verify Brightloop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: brightloop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brightloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://brightloop:ci-only-ephemeral-password@localhost:5432/brightloop
      BETTER_AUTH_URL: http://localhost:5173
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: generated-for-ci-ephemeral-not-a-production-secret-2026
      DEMO_SEED_TEST_CREDENTIALS_PATH: .local/hackathon-demo-credentials.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: npm run scan:secrets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
            artifacts
